# Blueprint de Render. En el panel: New > Blueprint > selecciona el repositorio.
# Verifica los nombres de plan y la región vigentes en tu cuenta antes de aplicarlo.
databases:
  - name: centro-actoral-db
    databaseName: dbcentroactoral
    user: centroactoral
    region: ohio
    postgresMajorVersion: "16"
    # IMPORTANTE: usa un plan de PAGO. La base gratuita de Render se elimina a los 30 días y no tiene respaldos.
    plan: basic-256mb
    ipAllowList: []            # sin acceso desde Internet: solo red privada de Render

services:
  - type: web
    name: centro-actoral-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: ohio
    plan: starter
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_MIGRATIONS
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase: { name: centro-actoral-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: CERT_HMAC_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: VERIFY_BASE_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: S3_AUTO_CREATE_BUCKET
        value: "false"
      - key: INSTITUCION_NOMBRE
        value: Centro Actoral de Boyacá
      - key: INSTITUCION_FIRMANTE
        sync: false
      - key: INSTITUCION_CARGO
        value: Director(a)
      - key: CERT_P12_BASE64
        sync: false
      - key: CERT_P12_PASSWORD
        sync: false

  # Respaldo diario 02:00 hora de Colombia (= 07:00 UTC). Es un trabajo separado de la API.
  - type: cron
    name: centro-actoral-backup
    runtime: docker
    dockerfilePath: ./deploy/backup/Dockerfile
    dockerContext: ./deploy/backup
    dockerCommand: /usr/local/bin/backup.sh
    schedule: "0 7 * * *"
    region: ohio
    plan: starter
    envVars:
      - key: PGHOST
        fromDatabase: { name: centro-actoral-db, property: host }
      - key: PGPORT
        fromDatabase: { name: centro-actoral-db, property: port }
      - key: PGUSER
        fromDatabase: { name: centro-actoral-db, property: user }
      - key: PGPASSWORD
        fromDatabase: { name: centro-actoral-db, property: password }
      - key: PGDATABASE
        fromDatabase: { name: centro-actoral-db, property: database }
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_PREFIX
        value: postgres
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: BACKUP_HEARTBEAT_URL
        sync: false
