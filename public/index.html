<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centro Actoral de Boyacá</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="page" class="content">
  <div class="hero">
    <div class="card-petrol hero-card" id="cta"></div>
    <div>
      <div class="sec-head"><h3 class="mb0">Perfiles sugeridos</h3><a class="link" href="actores.html">Explorar <span class="material-icons-round">arrow_forward</span></a></div>
      <div id="feat"><div class="spinner"></div></div>
    </div>
  </div>

  <section class="section">
    <div class="sec-head"><div><span class="eyebrow">Novedades</span><h2>Noticias</h2></div><button class="link hidden" id="news-more">Ver todas <span class="material-icons-round">arrow_forward</span></button></div>
    <div class="grid g3" id="news"></div>
  </section>

  <section class="section">
    <div class="sec-head"><div><span class="eyebrow">Formación</span><h2>Cursos</h2></div><button class="link hidden" id="courses-more">Ver todos <span class="material-icons-round">arrow_forward</span></button></div>
    <div class="grid g3" id="courses"></div>
  </section>
</main>
<script src="js/app.js"></script>
<script>
shell({ active: 'home' });

// Tarjeta principal según la sesión
const cta = $('#cta');
if (S.rol === 'actor') {
  cta.innerHTML = `<span class="eyebrow">Tu próximo escenario</span><h1>Hola, ${esc(S.nombre || '')}</h1>
    <p>Revisa el estado de tu postulación, aplica a convocatorias abiertas y sigue tu progreso en los cursos del Centro Actoral.</p>
    <div class="mt2"><a class="btn lime btn-cta" href="postulaciones.html"><span class="ic-circle">${ic('star')}</span> Ver mi postulación ${ic('arrow_forward')}</a></div>`;
} else if (S.rol === 'admin') {
  cta.innerHTML = `<span class="eyebrow">Administración</span><h1>Panel del Centro Actoral</h1>
    <p>Aprueba perfiles, publica cursos, convocatorias y noticias, y revisa el historial de actividad.</p>
    <div class="mt2"><a class="btn lime btn-cta" href="admin.html"><span class="ic-circle">${ic('dashboard')}</span> Ir al panel ${ic('arrow_forward')}</a></div>`;
} else {
  cta.innerHTML = `<span class="eyebrow" style="text-align:center">Tu próximo escenario</span>
    <h1>¿Deseas postularte como actor?</h1>
    <p>Inscríbete en el Registro Departamental de talento actoral, crea tu perfil profesional y participa en castings, convocatorias y procesos de formación del Centro Actoral de Boyacá.</p>
    <div class="mt2"><a class="btn lime btn-cta big" href="preparar.html"><span class="ic-circle">${ic('star')}</span> Postularme ${ic('arrow_forward')}</a></div>`;
}
cta.insertAdjacentHTML('beforeend', `<span class="spark material-icons-round" style="top:22px;left:24px">auto_awesome</span><span class="spark material-icons-round" style="top:40%;right:26px;font-size:18px">auto_awesome</span>`);

// Perfil sugerido (carrusel)
api('/api/actores?orden=azar&limit=8').then(list => {
  const box = $('#feat');
  if (!list.length) { box.innerHTML = `<div class="empty">${ic('groups')}Pronto verás aquí los perfiles aprobados del Centro Actoral.</div>`; return; }
  let i = 0;
  const draw = () => {
    const a = list[i];
    box.innerHTML = `<div class="feature-card" style="${bg(a.foto)}">
      ${a.foto ? '' : `<div style="position:absolute;inset:0;display:grid;place-items:center;color:var(--petrol);opacity:.3">${ic('person', 'style="font-size:140px"')}</div>`}
      <div class="top"><b>${esc(a.nombre)}</b><span class="chip turq">${ic('theater_comedy')} ${esc(rolLabel(a))}</span>
        <div style="color:var(--lime);font-weight:700;font-size:.85rem;margin-top:6px;text-shadow:0 1px 6px rgba(0,0,0,.4)">${esc(a.areas.slice(0, 2).join(' y ') || a.ciudad || '')}</div></div>
      <div class="bottom"><span class="mini" style="${bg(a.foto)}"></span>
        <div style="flex:1;min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.ciudad || '')}</b><small style="color:var(--lime)">${a.disponible ? 'Disponible' : 'No disponible'}</small></div>
        <a class="btn lime sm" href="perfil.html?id=${a.actor_id}">${ic('add')} Conectar</a></div></div>
      ${list.length > 1 ? `<div class="flex mt2" style="justify-content:center">
        <button class="icon-btn" id="prev" aria-label="Anterior">${ic('chevron_left')}</button>
        <span class="small muted">${i + 1} / ${list.length}</span>
        <button class="icon-btn" id="next" aria-label="Siguiente">${ic('chevron_right')}</button></div>` : ''}`;
    if (list.length > 1) { $('#prev').onclick = () => { i = (i - 1 + list.length) % list.length; draw(); }; $('#next').onclick = () => { i = (i + 1) % list.length; draw(); }; }
  };
  draw();
  if (list.length > 1) setInterval(() => { if (!document.hidden && !$('.modal-wrap')) { i = (i + 1) % list.length; draw(); } }, 6000);
}).catch(e => $('#feat').innerHTML = `<div class="err-msg">${esc(e.message)}</div>`);

// Noticias
api('/api/noticias').then(ns => {
  const box = $('#news');
  if (!ns.length) { box.innerHTML = `<div class="empty" style="grid-column:1/-1">${ic('newspaper')}Aún no hay noticias publicadas.</div>`; return; }
  const draw = n => {
    box.innerHTML = ns.slice(0, n).map((x, k) => `<div class="news-card" data-k="${k}" style="${x.imagen_url ? bg(x.imagen_url) : 'background:linear-gradient(135deg,var(--petrol),var(--petrol-3))'}">
      <div class="in"><b>${esc(x.titulo)}</b><small>${esc(x.resumen_para_carta)}</small></div></div>`).join('');
    $$('.news-card', box).forEach(c => c.onclick = () => noticiaModal(ns[c.dataset.k]));
  };
  draw(3);
  if (ns.length > 3) { const b = $('#news-more'); b.classList.remove('hidden'); b.onclick = () => { draw(ns.length); b.remove(); }; }
});

// Cursos
Promise.all([catalogos(), api('/api/cursos')]).then(([, cs]) => {
  const box = $('#courses');
  if (!cs.length) { box.innerHTML = `<div class="empty" style="grid-column:1/-1">${ic('school')}Pronto publicaremos nuevos cursos y talleres.</div>`; return; }
  const draw = n => box.innerHTML = cs.slice(0, n).map(courseCard).join('');
  draw(6);
  if (cs.length > 6) { const b = $('#courses-more'); b.classList.remove('hidden'); b.onclick = () => { draw(cs.length); b.remove(); }; }
});
</script>
</body>
</html>
