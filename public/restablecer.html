<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Nueva contraseña · Centro Actoral de Boyacá</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>#page.content{max-width:none;padding:0}.pw{position:relative}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:var(--muted)}</style>
</head>
<body>
<main id="page" class="content">
  <div class="auth-wrap">
    <div class="auth-art"><div style="position:relative;max-width:460px">
      <div class="brand mb2"><span class="logo"><span class="material-icons-round">theater_comedy</span></span><span><b style="color:#fff">CENTRO ACTORAL</b><small style="color:var(--lime)">DE BOYACÁ</small></span></div>
      <h1>Casi listo</h1><p style="opacity:.9">Elige una contraseña segura que no uses en otros sitios.</p></div></div>
    <div class="auth-form"><div class="box" id="box"></div></div>
  </div>
</main>
<script src="js/app.js"></script>
<script>
shell({});
const box = $('#box');
const token = new URLSearchParams(location.hash.slice(1)).get('token') || '';
history.replaceState(null, '', location.pathname); // el token no se queda en la barra ni en el historial
if (!/^[a-f0-9]{64}$/.test(token)) {
  box.innerHTML = `<div class="err-msg">El enlace no es válido o está incompleto.</div><a class="btn block big mt2" href="recuperar.html">Solicitar un nuevo enlace</a>`;
} else {
  box.innerHTML = `<span class="eyebrow">Nueva contraseña</span><h1 class="mt1">Crea tu nueva contraseña</h1>
  <p class="muted">Mínimo 8 caracteres, con letras y números.</p><div id="err"></div>
  <form id="f" class="mt2"><div class="field"><label>Nueva contraseña</label><div class="pw"><input type="password" name="c1" required minlength="8" autocomplete="new-password" style="padding-right:46px"><button type="button" id="eye" aria-label="Mostrar contraseña"><span class="material-icons-round">visibility</span></button></div></div>
  <div class="field"><label>Repite la contraseña</label><input type="password" name="c2" required minlength="8" autocomplete="new-password"></div>
  <button class="btn block big mt1" id="go">Guardar contraseña</button></form>`;
  $('#eye').onclick = () => { const i = $('#f').c1; i.type = i.type === 'password' ? 'text' : 'password'; $('#eye span').textContent = i.type === 'password' ? 'visibility' : 'visibility_off'; };
  $('#f').onsubmit = async e => {
    e.preventDefault();
    if (e.target.c1.value !== e.target.c2.value) { $('#err').innerHTML = '<div class="err-msg">Las contraseñas no coinciden.</div>'; return; }
    const b = $('#go'); b.disabled = true; b.textContent = 'Guardando...';
    try {
      await api('/api/restablecer-contrasena', { method: 'POST', body: { token, contrasena: e.target.c1.value } });
      box.innerHTML = `<div class="big-ok">${ic('check')}</div><h1 class="mt1">¡Contraseña actualizada!</h1><p class="muted">Ya puedes iniciar sesión con tu nueva contraseña.</p><a class="btn block big mt2" href="login.html">Iniciar sesión</a>`;
    } catch (er) { $('#err').innerHTML = `<div class="err-msg">${esc(er.message)} <a class="link" href="recuperar.html">Solicitar un nuevo enlace</a></div>`; b.disabled = false; b.textContent = 'Guardar contraseña'; }
  };
}
</script>
</body>
</html>
